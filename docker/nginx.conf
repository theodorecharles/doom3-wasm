server {
    listen 8088;
    server_name _;
    root /usr/share/nginx/html;
    location = /health {
        default_type application/json;
        add_header Cache-Control no-store;
        return 200 '{"ok":true,"game":"doom3-wasm","status":"owner-data-browser-client"}';
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Owner-supplied PK4s may be mounted into /data for future native-server
    # work, but they are never exposed by this diagnostic web server.
    location ^~ /data/ {
        return 404;
    }
}
